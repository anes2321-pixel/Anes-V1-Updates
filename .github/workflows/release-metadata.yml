name: Update Anes V1 updater metadata

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Update latest version on main and deploy Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time
          from urllib.request import Request, urlopen

          base = "https://api.github.com/repos/anes2321-pixel/Anes-V1-Updates"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "User-Agent": "Anes-V1-release-metadata",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET", data=None):
              request = Request(
                  base + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers=headers,
                  method=method,
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response) if response.status != 204 else None

          release = None
          for attempt in range(30):
              release = api("/releases/latest")
              if release.get("tag_name") and any(a.get("name") == "Anes-V1.jar" for a in release.get("assets", [])):
                  break
              time.sleep(10)
          else:
              raise SystemExit("Latest release is still missing its Anes-V1.jar asset")
          tag = release["tag_name"]
          data = json.dumps({
              "version": tag.removeprefix("v"),
              "build": 0,
              "minecraft": "1.21.11",
          }, separators=(",", ":"))
          path = "/contents/v1/version"
          old = api(path + "?ref=main")
          api(path, "PUT", {
              "message": f"Update updater metadata to {tag}",
              "content": base64.b64encode(data.encode()).decode(),
              "sha": old["sha"],
              "branch": "main",
          })
          api("/actions/workflows/deploy.yml/dispatches", "POST", {"ref": "main"})
          print(f"Updated Anes V1 updater metadata to {tag} and dispatched Pages deployment")
          PY
