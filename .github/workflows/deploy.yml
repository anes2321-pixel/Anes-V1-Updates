name: Deploy Anes V1 website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate updater metadata from latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINECRAFT_VERSION: 1.21.11
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              "https://api.github.com/repos/anes2321-pixel/Anes-V1/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "Anes-V1-updater-metadata",
              },
          )
          with urlopen(request, timeout=30) as response:
              release = json.load(response)
          tag = release.get("tag_name", "")
          if not tag:
              raise SystemExit("Latest release has no tag_name")
          version = tag.removeprefix("v")
          if not any(asset.get("name") == "Anes-V1.jar" for asset in release.get("assets", [])):
              raise SystemExit("Latest release is missing the Anes-V1.jar asset")
          metadata = {
              "version": version,
              "build": 0,
              "minecraft": os.environ["MINECRAFT_VERSION"],
          }
          Path("v1").mkdir(exist_ok=True)
          Path("v1/version").write_text(json.dumps(metadata), encoding="utf-8")
          print(f"Updater metadata prepared for Anes V1 {version}")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
